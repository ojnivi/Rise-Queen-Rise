name: Auto-Label Issues and PRs

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label based on title and body
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue?.title || context.payload.pull_request?.title || '';
            const body = context.payload.issue?.body || context.payload.pull_request?.body || '';
            const labels = [];
            
            const text = (title + ' ' + body).toLowerCase();
            
            // Content labels
            if (text.includes('affirmation') || text.includes('prompt')) {
              labels.push('content');
            }
            
            // Bug reports
            if (text.includes('bug') || text.includes('issue') || text.includes('error') || text.includes('broken')) {
              labels.push('bug');
            }
            
            // Feature requests
            if (text.includes('feature') || text.includes('enhancement') || text.includes('suggest') || text.includes('idea')) {
              labels.push('enhancement');
            }
            
            // Documentation
            if (text.includes('doc') || text.includes('readme') || text.includes('guide') || text.includes('tutorial')) {
              labels.push('documentation');
            }
            
            // Questions
            if (text.includes('question') || text.includes('how') || text.includes('help')) {
              labels.push('question');
            }
            
            // Community/Discussion
            if (text.includes('community') || text.includes('discussion') || text.includes('feedback')) {
              labels.push('community');
            }
            
            // Good first issue
            if (text.includes('good first') || text.includes('beginner') || text.includes('newcomer')) {
              labels.push('good first issue');
            }
            
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }
